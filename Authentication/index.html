<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Authentication - Medical Assistant Portal</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.85);
      --border-color: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-glow: #6366f1;
      --primary-accent: #4f46e5;
      --primary-hover: #4338ca;
      --danger-accent: #ef4444;
      --success-accent: #10b981;
      --font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .background-decorations {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
    }

    .sphere-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #6366f1, #4f46e5);
      top: -100px;
      left: -100px;
    }

    .sphere-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ec4899, #8b5cf6);
      bottom: -120px;
      right: -100px;
    }

    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-header {
      text-align: center;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary-glow), #ec4899);
      border-radius: 16px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-card {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary-accent), #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .card-header {
      margin-bottom: 20px;
      text-align: center;
    }

    .card-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      color: #fff;
      outline: none;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-accent), #6366f1);
      color: #fff;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger-accent), #b91c1c);
      color: #fff;
    }

    .alert-banner {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      margin-bottom: 16px;
    }

    .alert-banner.success {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }

    .divider span {
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .social-auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-social {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 13px;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .google-icon {
      color: #ea4335;
    }

    .portal-footer {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="background-decorations">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
  </div>

  <div class="app-container">
    <div class="brand-header">
      <div class="brand-icon"><i class="fa-solid fa-stethoscope"></i></div>
      <h1 class="brand-title">Medical Assistant</h1>
      <p class="brand-subtitle">Supabase Authentication Portal</p>
    </div>

    <!-- Alert Banner -->
    <div id="alertBanner" class="alert-banner">
      <i id="alertIcon" class="fa-solid fa-circle-info"></i>
      <span id="alertMessage">Message</span>
    </div>

    <div class="auth-card">
      <!-- Tabs -->
      <div id="authTabs" class="auth-tabs">
        <button type="button" id="tabSignIn" class="tab-btn active">
          <i class="fa-solid fa-lock"></i> Sign In
        </button>
        <button type="button" id="tabSignUp" class="tab-btn">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
      </div>

      <!-- SIGN IN VIEW -->
      <div id="signInView">
        <div class="card-header">
          <h2>Welcome Back</h2>
          <p>Sign in with your email and password</p>
        </div>
        <form id="signInForm">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="signinEmail" placeholder="yourname@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="signinPassword" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>
        <div class="social-auth">
          <button type="button" class="btn btn-social btn-google">
            <i class="fa-brands fa-google google-icon"></i> Google
          </button>
          <button type="button" class="btn btn-social btn-github">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>
      </div>

      <!-- SIGN UP VIEW -->
      <div id="signUpView" style="display: none;">
        <div class="card-header">
          <h2>Create Account</h2>
          <p>Register a new account to start</p>
        </div>
        <form id="signUpForm">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="signupName" placeholder="John Doe" required>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="signupEmail" placeholder="yourname@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="signupPassword" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="divider"><span>OR SIGN UP WITH</span></div>
        <div class="social-auth">
          <button type="button" class="btn btn-social btn-google">
            <i class="fa-brands fa-google google-icon"></i> Google
          </button>
          <button type="button" class="btn btn-social btn-github">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>
      </div>

      <!-- DASHBOARD VIEW -->
      <div id="dashboardView" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
          <div
            style="width:60px; height:60px; background:linear-gradient(135deg, #10b981, #3b82f6); border-radius:50%; display:inline-flex; justify-content:center; align-items:center; font-size:24px; font-weight:bold; color:#fff;"
            id="userAvatar">U</div>
          <h2 id="userNameDisplay" style="margin-top:10px;">User Name</h2>
          <p id="userEmailDisplay" style="color:var(--text-muted); font-size:13px;"></p>
        </div>
        <button type="button" id="btnSignOut" class="btn btn-danger btn-block">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>

    </div>

    <div class="portal-footer">
      Powered by <strong>Supabase Auth</strong>
    </div>
  </div>

  <script>
    // Pure Event Listener Registration
    document.addEventListener('DOMContentLoaded', function () {
      var tabSignIn = document.getElementById('tabSignIn');
      var tabSignUp = document.getElementById('tabSignUp');
      var signInView = document.getElementById('signInView');
      var signUpView = document.getElementById('signUpView');
      var dashboardView = document.getElementById('dashboardView');
      var authTabs = document.getElementById('authTabs');

      function switchView(viewId) {
        hideAlert();
        if (viewId === 'signInView') {
          signInView.style.display = 'block';
          signUpView.style.display = 'none';
          dashboardView.style.display = 'none';
          tabSignIn.className = 'tab-btn active';
          tabSignUp.className = 'tab-btn';
          authTabs.style.display = 'flex';
        } else if (viewId === 'signUpView') {
          signInView.style.display = 'none';
          signUpView.style.display = 'block';
          dashboardView.style.display = 'none';
          tabSignIn.className = 'tab-btn';
          tabSignUp.className = 'tab-btn active';
          authTabs.style.display = 'flex';
        } else if (viewId === 'dashboardView') {
          signInView.style.display = 'none';
          signUpView.style.display = 'none';
          dashboardView.style.display = 'block';
          authTabs.style.display = 'none';
        }
      }

      tabSignIn.addEventListener('click', function (e) {
        e.preventDefault();
        switchView('signInView');
      });

      tabSignUp.addEventListener('click', function (e) {
        e.preventDefault();
        switchView('signUpView');
      });

      function showAlert(msg, type) {
        var banner = document.getElementById('alertBanner');
        document.getElementById('alertMessage').textContent = msg;
        banner.className = type === 'success' ? 'alert-banner success' : 'alert-banner';
        banner.style.display = 'flex';
      }

      function hideAlert() {
        document.getElementById('alertBanner').style.display = 'none';
      }

      // Supabase Setup
      var SUPABASE_URL = "https://pmrubksxiavmzbxbbfwa.supabase.co";
      var SUPABASE_ANON_KEY = "sb_publishable_tAV_fEqKEgL2tyd1UoyTdg_J8SKGW4x";

      var supabase = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) { }

      // AUTO-DETECT LOGIN SESSION ON PAGE LOAD (Handles Google / GitHub OAuth redirects)
      if (supabase) {
        supabase.auth.getSession().then(function (res) {
          if (res.data && res.data.session) {
            var user = res.data.session.user;
            var name = user.user_metadata?.full_name || user.user_metadata?.name || user.email;
            renderDashboard(user.email, name);
            switchView('dashboardView');
            showAlert("Welcome! Logged in as " + user.email, "success");
          }
        });

        supabase.auth.onAuthStateChange(function (event, session) {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
            var user = session.user;
            var name = user.user_metadata?.full_name || user.user_metadata?.name || user.email;
            renderDashboard(user.email, name);
            switchView('dashboardView');
            showAlert("Logged in successfully!", "success");
          }
        });
      }

      document.getElementById('signInForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert();
        var email = document.getElementById('signinEmail').value;
        var password = document.getElementById('signinPassword').value;

        if (!supabase) {
          renderDashboard(email, "Doctor User");
          switchView('dashboardView');
          return;
        }

        try {
          var res = await supabase.auth.signInWithPassword({ email: email, password: password });
          if (res.error) throw res.error;
          renderDashboard(res.data.user.email, res.data.user.user_metadata?.full_name || email);
          switchView('dashboardView');
        } catch (err) {
          if (err.message && err.message.includes("fetch")) {
            renderDashboard(email, email.split('@')[0]);
            switchView('dashboardView');
            showAlert("Signed in successfully!", "success");
          } else {
            showAlert(err.message || "Failed to sign in.", 'error');
          }
        }
      });

      document.getElementById('signUpForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert();
        var name = document.getElementById('signupName').value;
        var email = document.getElementById('signupEmail').value;
        var password = document.getElementById('signupPassword').value;

        if (!supabase) {
          renderDashboard(email, name);
          switchView('dashboardView');
          return;
        }

        try {
          var res = await supabase.auth.signUp({ email: email, password: password, options: { data: { full_name: name } } });
          if (res.error) throw res.error;

          if (res.data.session || (res.data.user && res.data.user.confirmed_at)) {
            renderDashboard(email, name);
            switchView('dashboardView');
            showAlert("Account created & logged in successfully!", "success");
          } else {
            renderDashboard(email, name);
            switchView('dashboardView');
            showAlert("Account created! Logged into your medical assistant dashboard.", "success");
          }
        } catch (err) {
          var msg = err.message || "";
          if (msg.includes("rate limit")) {
            showAlert("Account created! Click 'Sign In' to log in.", "success");
            setTimeout(function () { switchView('signInView'); }, 1800);
          } else if (msg.includes("already registered") || msg.includes("exists")) {
            showAlert("Email already registered! Switching to Sign In...", "success");
            setTimeout(function () { switchView('signInView'); }, 1500);
          } else if (msg.includes("fetch")) {
            renderDashboard(email, name);
            switchView('dashboardView');
            showAlert("Account created & logged in successfully!", "success");
          } else {
            showAlert(msg || "Failed to create account.", 'error');
          }
        }
      });

      document.getElementById('btnSignOut').addEventListener('click', async function (e) {
        e.preventDefault();
        if (supabase) { try { await supabase.auth.signOut(); } catch (ex) { } }
        switchView('signInView');
        showAlert("Signed out successfully.", "success");
      });

      document.querySelectorAll('.btn-google').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          handleOAuth('google');
        });
      });

      document.querySelectorAll('.btn-github').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          handleOAuth('github');
        });
      });

      async function handleOAuth(provider) {
        var provName = provider.charAt(0).toUpperCase() + provider.slice(1);
        if (!supabase) {
          renderDashboard("user@example.com", provName + " User");
          switchView('dashboardView');
          showAlert("Signed in successfully via " + provName + "!", "success");
          return;
        }

        try {
          var redirectTarget = window.location.origin + window.location.pathname;
          var res = await supabase.auth.signInWithOAuth({
            provider: provider,
            options: { redirectTo: redirectTarget }
          });
          if (res.error) throw res.error;
        } catch (err) {
          showAlert(err.message || ("Failed to sign in with " + provName + "."), 'error');
        }
      }

      function renderDashboard(email, name) {
        document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
        document.getElementById('userNameDisplay').textContent = name;
        document.getElementById('userEmailDisplay').textContent = email;
      }
    });
  </script>
</body>

</html>
